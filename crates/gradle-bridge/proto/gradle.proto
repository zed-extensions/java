// Message schema adapted from `gradle.proto` embedded in vscode-gradle 3.18's
// shipped `gradle-server.jar` (package `com.github.badsyntax.gradle`), extracted
// with:
//
//     unzip -p gradle-server.jar gradle.proto
//
// vscode-gradle 3.18 transports these protobuf messages as base64 payloads
// inside JSON-RPC over a named pipe on Windows or a Unix-domain socket on Unix.
// RPC service declarations are intentionally omitted because JSON-RPC defines
// the transport. The corresponding Rust message types live in
// `src/gen/gradle.rs`.
//
syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.badsyntax.gradle";
option java_outer_classname = "GradleProto";

package gradle;

message GetBuildRequest {
  string project_dir = 1;
  string cancellation_key = 2;
  GradleConfig gradle_config = 3;
  bool show_output_colors = 4;
}

message GetBuildReply {
  oneof kind {
    GetBuildResult get_build_result = 1;
    Progress progress = 2;
    Output output = 3;
    Cancelled cancelled = 4;
    Environment environment = 5;
    string compatibility_check_error = 6;
  }
}

message GetProjectDependenciesRequest {
  string project_dir = 1;
  string project_path = 2;
  string cancellation_key = 3;
  GradleConfig gradle_config = 4;
  bool show_output_colors = 5;
}

message GetProjectDependenciesReply {
  DependencyItem dependency_item = 1;
}

message GetBuildResult {
  string message = 1;
  GradleBuild build = 2;
}

enum GradleDependencyType
{
  PROJECT = 0;
  CONFIGURATION = 1;
  DEPENDENCY = 2;
}

message DependencyItem {
  string name = 1;
  GradleDependencyType type = 2;
  repeated DependencyItem children = 3;
}

message GradleClosureProto {
  string name = 1;
  repeated GradleMethodProto methods = 2;
  repeated GradleFieldProto fields = 3;
}

message GradleMethodProto {
  string name = 1;
  repeated string parameterTypes = 2;
  bool deprecated = 3;
}

message GradleFieldProto {
  string name = 1;
  bool deprecated = 2;
}

message RunBuildRequest {
  string project_dir = 1;
  string cancellation_key = 2;
  repeated string args = 3;
  int32 java_debug_port = 4;
  GradleConfig gradle_config = 5;
  string input = 6;
  bool show_output_colors = 7;
  bool java_debug_clean_output_cache = 8;
  string additional_tool_options = 9;
}

message RunBuildResult {
  string message = 1;
}

message RunBuildReply {
  oneof kind {
    RunBuildResult run_build_result = 1;
    Progress progress = 2;
    Output output = 3;
    Cancelled cancelled = 4;
  }
}

message CancelBuildRequest {
  string cancellation_key = 1;
}

message CancelBuildsRequest {}

message CancelBuildReply {
  string message = 1;
  bool build_running = 2;
}

message CancelBuildsReply {
  string message = 1;
}

message GradleConfig {
  string gradle_home = 1;
  string user_home = 2;
  string jvm_arguments = 3;
  bool wrapper_enabled = 4;
  string version = 5;
  string java_extension_version = 6;
  string java_home = 7;
}

message GradleBuild { GradleProject project = 1; }

message GradleProject {
  bool is_root = 1;
  repeated GradleTask tasks = 2;
  repeated GradleProject projects = 3;
  string projectPath = 4;
  DependencyItem dependencyItem = 5;
  repeated string plugins = 6;
  repeated GradleClosureProto pluginClosures = 7;
  repeated string scriptClasspaths = 8;
}

message GradleTask {
  string name = 1;
  string group = 2;
  string path = 3;
  string project = 4;
  string buildFile = 5;
  string rootProject = 6;
  string description = 7;
  bool debuggable = 8;
}

message Cancelled {
  string message = 1;
  string project_dir = 2;
}

message Progress { string message = 1; }

message Environment {
  JavaEnvironment java_environment = 1;
  GradleEnvironment gradle_environment = 2;
}

message JavaEnvironment {
  string java_home = 1;
  repeated string jvm_args = 2;
}

message GradleEnvironment {
  string gradle_user_home = 1;
  string gradle_version = 2;
}

message Output {
  enum OutputType {
    STDERR = 0;
    STDOUT = 1;
  }

  OutputType output_type = 1;
  bytes output_bytes = 2;
}

message ExecuteCommandRequest {
    string command = 1;
    repeated string arguments = 2;
}

message ExecuteCommandReply {
    string result = 1;
}
