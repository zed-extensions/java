[package]
name = "gradle-lsp-bridge"
version.workspace = true
edition = "2021"
description = "Bridges Zed to the Gradle Language Server, driving the real gradle-server.jar over JSON-RPC for plugin-aware completions"
license = "Apache-2.0"
publish = false

[[bin]]
name = "gradle-lsp-bridge"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
prost = "0.14"
proxy-common = { workspace = true, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
