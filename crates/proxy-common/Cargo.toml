[package]
name = "proxy-common"
version.workspace = true
edition = "2021"
description = "Shared primitives (LSP framing, parent-process monitor) for the Zed Java extension's native binaries"
license = "Apache-2.0"
publish = false

[features]
tokio = ["dep:tokio"]

[lib]
name = "proxy_common"
path = "src/lib.rs"

[dependencies]
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
