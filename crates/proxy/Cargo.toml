[package]
name = "java-lsp-proxy"
version.workspace = true
edition = "2021"
description = "Native LSP proxy for the Zed Java extension"
license = "Apache-2.0"
publish = false

[[bin]]
name = "java-lsp-proxy"
path = "src/main.rs"

[dependencies]
hex = "0.4"
proxy-common.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
