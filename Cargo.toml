[package]
name = "zed_java"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/java.rs"

[dependencies]
hex = "0.4.3"
percent-encoding = "2.3.2"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
zed_extension_api = "0.7.0"

[dev-dependencies]
insta = { version = "1.46", features = ["yaml"] }
tree-sitter = "0.26.8"
tree-sitter-java = "0.23.5"
# Same commit as `grammars.kotlin` in extension.toml, so the test compiles the queries Zed loads.
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "1852ea17b7f60fb3f9d84e0b1555d56b46b39fb1" }

[workspace]
resolver = "3"
members = [
  ".",
  "crates/gradle-bridge",
  "crates/proxy",
  "crates/proxy-common",
]
default-members = ["."]

[workspace.package]
version = "6.8.31"

[workspace.dependencies]
proxy-common = { path = "crates/proxy-common" }
